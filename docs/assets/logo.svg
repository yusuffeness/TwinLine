<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" viewBox="0 0 560 140" role="img" aria-labelledby="title">
  <title id="title">TwinLine</title>
  <defs>
    <linearGradient id="twin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>
  <!-- Two lines that look alike: the second one is shifted, as a near duplicate is. -->
  <rect x="20" y="38" width="96" height="18" rx="9" fill="url(#twin)"/>
  <rect x="36" y="84" width="96" height="18" rx="9" fill="url(#twin)" opacity="0.85"/>
  <text x="160" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1" fill="#c0caf5">Twin<tspan fill="url(#twin)">Line</tspan></text>
</svg>
