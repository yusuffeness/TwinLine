name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: "23.1.5"
  CLANG_TIDY_VERSION: "23.1.4"
  GCOVR_VERSION: "8.8"

jobs:
  build:
    name: Build and test (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
          - { os: macos-15, cc: clang }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            flags: -DTWINLINE_ENABLE_ASAN=ON -DTWINLINE_ENABLE_UBSAN=ON
          - name: TSan
            flags: -DTWINLINE_ENABLE_TSAN=ON
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4

      # Recent runner kernels use more ASLR bits than the sanitizer runtimes expect.
      - name: Reduce ASLR entropy for the sanitizer runtimes
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2

  valgrind:
    name: Valgrind
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends valgrind

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel

      - name: Unit tests under Valgrind
        run: |
          for test in build/tests/test_*; do
            echo "::group::$(basename "$test")"
            valgrind --error-exitcode=99 --leak-check=full \
              --errors-for-leak-kinds=definite,indirect --quiet "$test"
            echo "::endgroup::"
          done

      - name: Integration tests under Valgrind
        env:
          TWINLINE_TEST_WRAPPER: valgrind --error-exitcode=99 --leak-check=full --errors-for-leak-kinds=definite,indirect --quiet
          TWINLINE_TUI_TIMEOUT: "90"
        run: ctest --test-dir build -L integration --output-on-failure

  lint:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned LLVM tools
        run: pip install "clang-format==${CLANG_FORMAT_VERSION}" "clang-tidy==${CLANG_TIDY_VERSION}"

      - name: clang-format
        run: make format-check

      - name: Configure (compile database for clang-tidy)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: clang-tidy
        run: clang-tidy -p build --quiet src/*.c src/*/*.c

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gcovr
        run: pip install "gcovr==${GCOVR_VERSION}"

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTWINLINE_ENABLE_COVERAGE=ON
          cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Coverage report
        run: |
          gcovr --root . --object-directory build --filter src/ \
            --xml coverage.xml --print-summary --fail-under-line 80 \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [utf8, featureset, command_parse]
    steps:
      - uses: actions/checkout@v4

      - name: Reduce ASLR entropy for the sanitizer runtimes
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang
          -DTWINLINE_BUILD_FUZZERS=ON -DTWINLINE_ENABLE_ASAN=ON -DTWINLINE_ENABLE_UBSAN=ON

      # Only the fuzz targets are built: in this configuration the library is
      # instrumented for libFuzzer and cannot be linked into ordinary programs.
      - name: Build
        run: cmake --build build --target fuzz_${{ matrix.target }}

      - name: Fuzz for 60 seconds
        run: |
          mkdir -p corpus artifacts
          ./build/tests/fuzz_${{ matrix.target }} -max_total_time=60 -max_len=4096 \
            -artifact_prefix=artifacts/ corpus tests/fuzz/corpus/${{ matrix.target }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: artifacts/

  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTWINLINE_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Generate the 1 MiB corpus
        run: python3 scripts/gen_corpus.py --size 1MiB --output corpus/corpus-1MiB.txt

      - name: Run the benchmark
        run: |
          ./build/bench/bench_analysis --repeat=3 --threads=1,2,4 \
            --json=benchmark.json corpus/corpus-1MiB.txt | tee benchmark.txt
          { echo '```'; cat benchmark.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Fails if MinHash reports a pair that is not similar or the strategies
      # disagree on identical lines; the recall is shown in the summary.
      - name: Check the MinHash accuracy
        run: |
          for t in 0.5 0.7 0.9; do
            ./build/bench/bench_accuracy --threshold=$t corpus/corpus-1MiB.txt
          done | tee accuracy.txt
          { echo '```'; cat accuracy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Results of the last run on main are kept in the Actions cache and
      # compared with this run; a slowdown beyond the threshold is reported.
      - name: Restore previous results
        uses: actions/cache/restore@v4
        with:
          path: ./benchmark-history
          key: benchmark-${{ runner.os }}-${{ github.run_id }}
          restore-keys: benchmark-${{ runner.os }}-

      - name: Compare with previous results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TwinLine analysis
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          external-data-json-path: ./benchmark-history/data.json
          alert-threshold: "130%"
          fail-on-alert: false
          summary-always: true

      - name: Save results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ./benchmark-history
          key: benchmark-${{ runner.os }}-${{ github.run_id }}
