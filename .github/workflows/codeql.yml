name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (C)
    # Code scanning is free for public repositories only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTWINLINE_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
