name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security problems go
        through the security policy instead (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The commands you ran and, if possible, a small input file that shows the problem.
      placeholder: |
        1. printf 'a b\na b\n' > notes.txt
        2. twinline analyze notes.txt
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TwinLine version
      description: The output of `twinline --version`.
      placeholder: TwinLine 1.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and terminal
      placeholder: Ubuntu 24.04, GNOME Terminal / macOS 15, iTerm2
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Homebrew
        - Debian package
        - Docker image
        - Release archive
        - Built from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Any error message or output. It is shown as code.
      render: text
